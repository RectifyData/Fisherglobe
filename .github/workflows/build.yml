name: Build A54 to A52s port

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Inspect firmware first, or attempt the experimental recovery ZIP
        type: choice
        options: [inspect, build]
        default: inspect
      donor_model:
        description: International donor model
        type: choice
        options: [SM-A546B, SM-A546E]
        default: SM-A546B
      donor_region:
        description: Donor CSC (EUX, BTE, INS, XME, etc.)
        type: string
        default: EUX
  push:
    branches: [arena/dfcc4d72-fisherglobe]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/build.sh'
      - 'scripts/prepare_port.py'

permissions:
  contents: read

concurrency:
  group: port-build-${{ github.ref }}-${{ inputs.stage || 'inspect' }}
  cancel-in-progress: false

jobs:
  port:
    name: ${{ inputs.stage || 'inspect' }} A54 system on A52s hardware
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DEBIAN_FRONTEND: noninteractive
      FISHERGLOBE_WORK: ${{ github.workspace }}/.work
      STAGE: ${{ inputs.stage || 'inspect' }}
      DONOR_MODEL: ${{ inputs.donor_model || 'SM-A546B' }}
      DONOR_REGION: ${{ inputs.donor_region || 'EUX' }}
      # Public model TACs by default; optional secrets must also be EIGHT-digit TACs.
      # Never put a personal IMEI or serial in workflow inputs or logs.
      FISHERGLOBE_DONOR_TAC: ${{ secrets.FISHERGLOBE_DONOR_TAC }}
      FISHERGLOBE_TARGET_TAC: ${{ secrets.FISHERGLOBE_TARGET_TAC }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate requested stage and prepare runtime config
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open('config/port.json'))
          c['donor']['model'] = os.environ['DONOR_MODEL']
          c['donor']['region'] = os.environ['DONOR_REGION']
          json.dump(c, open('config/runtime.json', 'w'), indent=2)
          PY
          echo "FISHERGLOBE_CONFIG=$PWD/config/runtime.json" >> "$GITHUB_ENV"
          mkdir -p reports out
      - name: Reclaim runner disk (only disposable preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # Do not wait on the runner Docker daemon; the disposable toolchains
          # above provide the space needed for this sequential firmware build.
          df -h .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Fetch exact engine, guide and tool revisions
        run: bash scripts/fetch_sources.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('config/locks.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install filesystem and Android image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            attr bc brotli ccache clang cmake curl e2fsprogs erofs-utils ffmpeg \
            fuse3 git git-lfs jq libbrotli-dev libbz2-dev libgtest-dev libpcre2-dev \
            libprotobuf-dev libunwind-dev libzstd-dev lld lz4 make p7zip-full \
            perl protobuf-compiler python3-venv rsync shellcheck unzip webp xxd zip zstd \
            linux-modules-extra-$(uname -r)
          sudo modprobe erofs
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Resolve, download, extract and port
        id: port
        run: |
          set -o pipefail
          bash scripts/build.sh "$STAGE" 2>&1 | tee reports/pipeline.log
      - name: Audit assembled vendor before accepting artifact
        if: env.STAGE == 'build'
        run: python3 scripts/audit_firmware.py --engine .work/engine --workdir --reports reports
      - name: Surface pipeline failure in the check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('reports/pipeline.log')
          text = p.read_text(errors='replace')[-5000:] if p.exists() else 'Pipeline failed before its log was created; inspect the failed step.'
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Port pipeline failure::' + text)
          PY
      - name: Surface pipeline failure in the check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('reports/pipeline.log')
          text = p.read_text(errors='replace')[-5000:] if p.exists() else 'Pipeline failed before its log was created; inspect the failed step.'
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Port pipeline failure::' + text)
          PY
      - name: Summarize actual result (never infer a successful boot)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r = pathlib.Path('reports')
          lines = ['# Fisherglobe build report', '', '**Hardware boot: NOT TESTED.**', '']
          for name in ('firmware-plan.json', 'firmware-audit.json', 'port-profile.json', 'artifact-validation.json'):
              p = r / name
              if p.exists():
                  d = json.loads(p.read_text())
                  d.pop('source_config', None)
                  lines += ['## ' + name, '```json', json.dumps(d, indent=2), '```', '']
                  if name == 'firmware-plan.json':
                      print('::notice title=Firmware inputs::A54=' + d['donor_version'] + '; A52s=' + d['target_version'])
                  if name == 'firmware-audit.json':
                      for role, item in d['inputs'].items():
                          print(f'::notice title={role} firmware::{item["model"]} SDK {item["system_sdk"]}, vendor {item["vendor_device"]}, patch {item["security_patch"]}')
          log = r / 'pipeline.log'
          if log.exists():
              tail = log.read_text(errors='replace').splitlines()[-45:]
              lines += ['## Pipeline log tail', '```text', *tail, '```']
          text = '\n'.join(lines)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(text[:900000] + '\n')
          PY
      - name: Retain small reports and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: port-reports-${{ github.run_id }}
          path: |
            reports/*.json
            reports/*.log
            reports/build-config.sh
            reports/SHA256SUMS
            .work/engine/out/skipped_patches.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload experimental recovery ZIP
        if: success() && env.STAGE == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EXPERIMENTAL-a52sxq-${{ github.run_id }}
          path: |
            out/Fisherglobe_EXPERIMENTAL_*.zip
            reports/SHA256SUMS
            reports/artifact-validation.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
